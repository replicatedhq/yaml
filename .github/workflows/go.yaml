---
name: Go
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Show Go version
        run: go version
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./... -v
